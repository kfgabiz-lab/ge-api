# 환경 3: 개발서버 배포 전용
# 배포 담당자 관리 — 개발자가 직접 수정하지 않음
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate   # 배포 환경 — 스키마 자동 변경 차단
  mail:
    host: 10.153.2.44
    port: 25
    username: A003elesmtp
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  data:
    redis:
      host: redis-lse-kc-dev-nahp-01.redis.cache.windows.net
      port: 6380
      password: ${AZURE_REDIS_ACCESS_KEY:}
      ssl:
        enabled: true
      connect-timeout: 5s
      timeout: 3s
  session:
    store-type: redis
    timeout: 1d
    redis:
      namespace: nahpdev:session
      flush-mode: on-save
      save-mode: on-set-attribute
      repository-type: indexed
  cache:
    type: redis

server:
  servlet:
    session:
      cookie:
        secure: true

# CORS — 개발서버 FE 주소
cors:
  allowed-origins: "http://10.153.10.150:3002,http://10.153.10.150:3001,http://10.153.9.150,https://nahpdev.ls-electric.com,https://nahpdev-web.ls-electric.com/,https://afd-lse-nahp-dev-crg4emfxbvfnbddy.a01.azurefd.net"

# 파일 업로드 루트 경로
file:
  upload-root: "C:/uploads"

# 페이지 템플릿 TSX 파일 출력 경로
page-template:
  output-dir: "../bo/src/app/admin/generated"

# Slug Entity 코드 생성기 설정 — 이 기능은 local 프로파일에서만 동작하므로 dev(배포) 프로파일에서는 실사용되지 않는다.
# (앱 부팅 안전성을 위해 값만 명시. @Value 기본값이 있어 이 키가 없어도 부팅에는 문제 없음)
codegen:
  entity:
    entity-dir: "src/main/java/com/ge/bo/entity"
    dto-dir: "src/main/java/com/ge/bo/dto"
    repository-dir: "src/main/java/com/ge/bo/repository"
    service-dir: "src/main/java/com/ge/bo/service"
    controller-dir: "src/main/java/com/ge/bo/controller"

# 배포 환경 — WARN 수준만 출력
logging:
  level:
    root: WARN
    com.ge.bo: WARN


