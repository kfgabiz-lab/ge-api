

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:developer}   # ★ 실행 환경 선택 — local / developer / dev (환경변수 우선, 미설정 시 developer)
  main:
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      write-dates-as-timestamps: false  # LocalDateTime → ISO-8601 문자열로 직렬화
  servlet:
    multipart:
      max-file-size: 50MB       # 파일 1개 최대 크기
      max-request-size: 200MB   # 요청 전체 최대 크기
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    web:
      pageable:
        max-page-size: 10000

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        path: /

# JWT 설정
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400        # 1시간 (초)
    refresh-expiration: 604800  # 7일 (초)
  mail:
    # Training 알림메일 헤더 로고 — SVG 는 Outlook 등 다수 메일 클라이언트가 렌더링 못 해서 PNG 사용(ge-fo 배포 후 반영)
    # TODO: 운영 도메인 확정 후 override 필요
    logo-url: https://nahpdev.ls-electric.com/img/logo.png

# 로깅 기본 수준 (각 환경 yml에서 override 가능)
logging:
  level:
    root: WARN
    com.ge.bo: INFO


ls:
  isApiLogin: true
  totp:
    isUser: "LSE Admin"
    enabled: true   # true = 2차인증 활성화 / false = 비밀번호만으로 로그인
  lse:
    sso:
      baseUrl: https://lsesso.ls-electric.com/service
      sysName: NAHP          # SSO 시스템 코드
      defaultRole: PENDING_ADMIN      # SSO 자동 생성 계정 기본 역할
