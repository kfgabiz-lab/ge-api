plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ge'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // .env 파일을 Spring Environment로 자동 로드 (실행 방식과 무관하게 동작 — IDE Run 버튼 포함)
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Spring Boot 기본
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // PostgreSQL 드라이버
    runtimeOnly 'org.postgresql:postgresql'

    // JSONB ↔ String 변환 (Hibernate 6 + PostgreSQL JSONB 타입 지원)
    // JSONB ↔ String 변환 — Hibernate 6.6.15(Spring Boot 3.5.0)와 호환되는 최신 버전으로 교체.
    // 3.9.0은 이후 Hibernate 6.6.x 패치와의 바인딩 호환성 문제로 jsonb 컬럼 저장 시
    // "column is of type jsonb but expression is of type character varying" 오류가 발생
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.15.4'

    // JWT 토큰 처리
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Apache POI — xlsx/csv 엑셀 파일 생성
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // TOTP 2차 인증 (Google/Microsoft Authenticator 지원)
    implementation 'dev.samstevens.totp:totp:1.7.1'

    // Lombok (코드 자동생성) — Java 25 지원 버전 고정
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // azure blob storage
    implementation 'com.azure:azure-storage-blob:12.30.0'

    // java mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // HTML sanitize/파싱 — SSQ version_desc 정제, data-oembed-url 추출용
    implementation 'org.jsoup:jsoup:1.18.1'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // streaming api
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 로그인 엔드포인트 IP 단위 Rate Limiting (토큰버킷) — LoginRateLimitFilter에서 사용
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.14.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}
